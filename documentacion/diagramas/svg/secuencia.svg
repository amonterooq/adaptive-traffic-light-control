<text x="755.0" y="275.05555555555554" text-anchor="middle" font-family="Arial" font-size="15.666666666666668" fill="#23473e" font-weight="bold">4. Aplicar y avanzar</text>
<text x="755.0" y="292.72222222222223" text-anchor="middle" font-family="Arial" font-size="15.666666666666668" fill="#23473e" font-weight="normal">TraCI: estado y</text>
